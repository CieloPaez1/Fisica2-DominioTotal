server.port=8080

# Configuración H2 Database persistente
spring.datasource.url=jdbc:h2:file:./data/fisica2db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 para inspección de base de datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ruta local de PDFs de la cátedra
catedra.pdf.directory=C:/Users/Cielo/Documents/fisica2
